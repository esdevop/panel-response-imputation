[project]
name = "panel-response-imputation"
version = "0.1.0"
description = "Imputing a panelist's missing survey responses from demographics and purchase history, benchmarked against donor hot-deck"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
